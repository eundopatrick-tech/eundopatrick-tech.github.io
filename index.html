<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ① 맨 위 제목 -->
  <header class="top">
    <h1>Drink Menu</h1>
    <p>Choose a category · 카테고리를 선택하세요</p>
  </header>

  <!-- ② 카테고리 버튼 자리 (버튼은 menu-data.js 의 CATEGORIES 로 자동 생성) -->
  <main id="categories" class="cat-grid"></main>

  <!-- ③ 맨 아래 안내문 -->
  <footer>
    <p>Tap a drink photo and show it to our barista.<br>음료 사진을 눌러 직원에게 보여주세요.</p>
  </footer>

  <script src="menu-data.js"></script>
  <script>
    // 카테고리마다 버튼 하나씩 만들기 (대표 사진 = 그 카테고리의 첫 번째 음료)
    const box = document.getElementById('categories');
    CATEGORIES.forEach(c => {
      const first = MENU.find(m => m.cat === c.id);
      const count = MENU.filter(m => m.cat === c.id).length;
      box.innerHTML += `
        <a class="cat" href="menu.html?cat=${c.id}">
          <img src="${first ? first.img : ''}" alt="${c.en}" loading="lazy">
          <strong>${c.en}</strong>
          <span>${c.ko} · ${count}</span>
        </a>`;
    });
  </script>
</body>
</html>
